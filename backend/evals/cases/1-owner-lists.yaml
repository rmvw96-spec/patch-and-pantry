      - {text: "Valencia orange $1 each", expect: {item: Orange, quantity: 1, unit: each, price: 100}}
      - {text: "Cantaloupe $5 each", expect: {item: Cantaloupe, quantity: 1, unit: each, price: 500}}
      - text: "Satsuma $1 each"
        why: Owner, 2026-11-12, a satsuma is a large orange.
        expect: {item: Orange, quantity: 1, unit: each, price: 100}
      - {text: "Diamond sweet, red Phoenix, bubblegum plumbs $4/lb", expect: {item: Plum, quantity: 1, unit: lb, price: 400}}
      - {text: "Corn on the cob 5 for $6", expect: {item: Sweet corn, quantity: 5, unit: each, price: 600}}
      - {text: "Butter beans frozen $8/lb", expect: {item: Frozen lima beans, quantity: 1, unit: lb, price: 800}}
      - text: "Purple hull peas frozen $8/lb"
        why: Frozen southern peas are not in the catalog.
        expect:
          - {ask: no_match, options: [Southern pea]}
          - {ask: which_item, options: [Southern pea]}
      - {text: "Lima beans frozen $8/lb", expect: {item: Frozen lima beans, quantity: 1, unit: lb, price: 800}}
      - {text: "Walnuts with shell $8/lb", expect: {item: Walnut, quantity: 1, unit: lb, price: 800}}
      - {text: "Hazelnuts $5/lb", expect: {item: Hazelnut, quantity: 1, unit: lb, price: 500}}
      - {text: "Pecans $5/lb", expect: {item: Pecan, quantity: 1, unit: lb, price: 500}}
      - {text: "Raw peanuts $4/lb", expect: {item: Peanut, quantity: 1, unit: lb, price: 400}}
      - {text: "Bananas 69 cents a pound", expect: {item: Banana, quantity: 1, unit: lb, price: 69}}
      - text: "Garlic head 89 cents each"
        expect:
          - {item: Garlic, quantity: 1, unit: each, price: 89}
          - {item: Garlic, quantity: 1, unit: head, price: 89}
      - {text: "Carrots $1.5/lb", expect: {item: Carrot, quantity: 1, unit: lb, price: 150}}
      - {text: "Grapefruit $2 each", expect: {item: Grapefruit, quantity: 1, unit: each, price: 200}}
      - {text: "Cut okra frozen $6/lb", expect: {item: Frozen okra, quantity: 1, unit: lb, price: 600}}
