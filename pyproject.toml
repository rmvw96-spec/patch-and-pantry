[dependency-groups]
dev = [
    "prek>=0.5.3,<1.0.0",
    "zizmor>=1.30.1",
]

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
    "backend/evals/lists/",  # real lists, typed as written: misspellings are the test
    "data/sources/",
]


[tool.typos.default]
# Deliberate misspellings (test inputs for fuzzy matching) end their line with this marker.
extend-ignore-re = ["(?Rm)^.*#\\s*spellchecker:disable-line$"]

[tool.typos.default.extend-words]
hass = "hass"  # Hass avocados

[tool.typos.default.extend-identifiers]
alls = "alls"
